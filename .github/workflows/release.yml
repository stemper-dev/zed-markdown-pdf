name: Release

# Release prerequisites (configured in GitHub, not this file):
#   - immutable releases enabled
#   - a ruleset restricting refs/tags/v* creation and blocking updates/deletion
#   - a protected `release` environment with required reviewers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate & build sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Verify release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          versions=(
            "$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
            "$(awk -F '"' '/^version = / { print $2; exit }' extension.toml)"
            "$(node -p "require('./sidecar/package.json').version")"
            "$(node -p "require('./sidecar/package-lock.json').version")"
            "$(awk '$0 == "name = \"markdown-pdf\"" { found=1; next } found && /^version = / { gsub(/\"/, "", $3); print $3; exit }' Cargo.lock)"
          )
          for version in "${versions[@]}"; do
            [[ "$version" == "$expected" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
              exit 1
            }
          done
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tagged commit is not on origin/main" >&2
            exit 1
          }

      - name: Build & bundle sidecar
        run: ./scripts/package-sidecar.sh # -> markdown-pdf-sidecar.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidecar-release
          path: markdown-pdf-sidecar.tar.gz
          if-no-files-found: error

  publish:
    name: Publish immutable release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sidecar-release

      # v2.6.2 creates a draft, uploads assets, then publishes it so immutable
      # releases are locked only after the sidecar is attached.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: markdown-pdf-sidecar.tar.gz

      - name: Verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)" == true ]] || {
            gh release delete "$GITHUB_REF_NAME" --yes
            echo "Deleted mutable release; enable release immutability before retrying" >&2
            exit 1
          }

  registry:
    name: Open zed-industries/extensions PR
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    # COMMITTER_TOKEN should be a narrowly scoped GitHub App token or a classic
    # PAT with public_repo only. Never grant workflow.
    steps:
      - uses: huacnlee/zed-extension-action@82920ff0876879f65ffbcfa3403589114a8919c6 # post-v2.0.0 v2 branch commit
        with:
          extension-name: markdown-pdf
          push-to: stemper-dev/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
